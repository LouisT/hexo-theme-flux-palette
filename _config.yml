# Shipped defaults. Put site preferences in the site's _config.flux-palette.yml.
menu: # site menu
  Home: /
  Blog: /blog/
  Projects: /projects/
  Misc:
    Archives: /archives/
    Cloud: /cloud/
    Search: /search/

home: # home page configuration
  mode: blog # "blog" or "projects"
  curated:
    enabled: false
    pinned_limit: 3 # Cards visible at once on desktop; additional pinned articles scroll
    projects_limit: 3 # Cards visible at once on desktop; additional featured projects scroll
    topics: [] # [{label: "Engineering", url: "/categories/Engineering/"}]

blog: # blog page configuration
  title: "Blog" # custom title

projects: # projects page configuration
  title: "Projects" # custom title
  filters:
    enabled: true

archive: # archive page configuration
  years_per_page: 5 # paginate /archives/ by year groups

search: # search
  enabled: true # set to false to turn off search
  title: "Search" # page title
  debounce: 3000 # Milliseconds to wait after typing before searching.
  local_fallback: true # local fallback for Redis/Supabase; native providers require successful indexing
  upload:
    timeout_ms: 15000 # timeout for each remote upload request
    fail_on_error: false # set true to require a successful remote upload for the build
  service: local # Options: 'local', 'upstash', 'supabase', 'turso', 'upstash_search'
  turso:
    url: "" # libsql://your-database.turso.io or its HTTPS origin
    token: "" # Site config supplies a build-only write token, usually with env:VARIABLE.
    read_token: "" # Site config supplies a separate public read-only token.
    table: flux_search # prefix for theme-owned document and FTS5 tables
  upstash_search:
    url: "" # Upstash Search REST URL (separate from the Redis provider)
    token: ""
    read_token: ""
    index: flux
    max_results: 100 # candidate chunks, deduplicated into article results
    semantic_weight: 0.75
    reranking: false
    input_enrichment: false
  supabase:
    url: "" # Configure the provider and env:VARIABLE references in the site config.
    sec_key: ""
    pub_key: ""
    table: "flux_search"
  upstash:
    url: "" # Upstash Redis REST URL (separate from Upstash Search).
    token: "" # Build-only write token.
    read_token: "" # Public read-only token.
    index: flux

cloud: # cloud page for categories and tags
  enabled: true # set to false to disable the cloud page
  path: cloud/ # output path for the page
  title: "Cloud"
  sort_by: count # Options: 'count' or 'name'
  sort_order: desc # Options: 'desc' or 'asc'
  min_size: 0.95 # smallest tag text size in rem
  max_size: 2.2 # largest tag text size in rem
  controls:
    enabled: true # local topic filtering and sorting
  categories:
    enabled: true
    title: "Categories"
    path: categories/ # cloud index page path for categories
    page_title: "Categories"
  tags:
    enabled: true
    title: "Tags"
    path: tags/ # cloud index page path for tags
    page_title: "Tags"

backtotop: # back to top button
  enabled: true # set to false to turn off back to top button

sidebar:
  recent_projects:
    enabled: true # set false to hide the section
    limit: 5 # how many recent projects to show
  social_buttons: # social buttons
    enabled: true # set to false to turn off social buttons
    size: 1.6em # icon size
  palette_selector: # palette selector
    enabled: true # set to false to turn off palette selector
    default_dark: solar-amber # default dark palette
    default_light: paper-and-ink # default light palette
    palette_folder: css/palettes # folder for palette css files
    # include: [solar-amber, paper-and-ink] # defaults must be included

feeds: # unified feed and sitemap options
  enabled: true # set to false to turn off all feed generation
  limit: 20 # number of posts in rss/atom
  include_drafts: false
  include_future: false
  summary_length: 300 # max plain text summary per item
  mark_encrypted_in_title: true # prefix [Encrypted] to titles
  add_encrypted_element: true # add <encrypted>true</encrypted>
  rss:
    enabled: true
    path: rss.xml # output file (relative to root)
    footer: true # show rss.xml link in footer
  atom:
    enabled: true
    path: atom.xml # output file (relative to root)
    footer: true # show atom.xml link in footer
  sitemap:
    enabled: true
    path: sitemap.xml # output file (relative to root)
    footer: true # show sitemap.xml link in footer
    include_home: true
    include_posts: true
    include_pages: true
    include_archives: true
    include_categories: true
    include_tags: true
    include_projects: true
    include_search_page: true
    exclude:
      - 404.html

short_url: # short URL options
  enabled: true # set to false to turn off all short URLs
  length: 6 # characters in hash

swc:
  enabled: true # set to false to turn off SWC
  target: es2020 # target environment
  minify: true # set to false to disable minification
  include: # folders to include
    - js/
  exclude: [] # folders to exclude

read_time: # read time options
  enabled: true # set to false to turn off read time
  write_front_matter: false # write read time to front matter

# Enable comments service (either 'giscus' or 'utterances')
# See https://giscus.app/#repository for giscus settings
# See https://utteranc.es/#install for utterances settings
comments:
  enabled: false # Enable after configuring your own comment repository.
  sync_theme: true
  service: giscus # Options: 'giscus', 'utterances'
  giscus:
    repo: "" # [Required]
    repo_id: "" # [Required]
    category: "General" # [Required]
    category_id: "" # [Required]
    mapping: "pathname"
    reactions_enabled: "1"
    emit_metadata: "0"
    input_position: "top"
    theme: "preferred_color_scheme"
    lang: "en"
  utterances:
    repo: "" # [Required]
    issue_term: "pathname"
    label: "comments"
    theme: "github-light"

gallery:
  thumbnails: true # Default behavior
  # Provider URL pattern. %s is replaced by the absolute image URL.
  # Example: https://wsrv.nl/?url=%s&w=400&q=80
  service_pattern: "https://wsrv.nl/?url=%s&w=300&h=300&fit=inside&q=80"

# Link preview tooltip for internal links
link_previews:
  enabled: true

# Show theme credit. Feeds our ego. Please, we're starving.
attribution: # attribution options
  enabled: true # set to false to turn off attribution
  link: https://louist.dev/projects/flux-palette/
  text: Flux Palette by LouisT

# Reading controls and browser-local bookmarks
reading:
  enabled: true
related_content:
  enabled: true
  limit: 4
images:
  enabled: true
  widths: [320, 640, 960, 1280]
  quality: 80
heading_links:
  enabled: true
print:
  enabled: true
offline:
  enabled: false
  max_articles: 50
  max_bytes: 52428800
embeds:
  enabled: true
content_freshness:
  enabled: true
  stale_notice:
    enabled: false
    after_days: 365
build_cache:
  enabled: true
playground:
  enabled: false

# Output optimization; stable aliases remain available for older integrations.
assets:
  minify_css: true
  fingerprint: true
  cache_headers: false
build:
  # concurrency: 4 # optional shared native-work limit, 1-8; automatic by default

series:
  enabled: true
  items: {} # id: {title: "Series title", description: "Optional summary"}
